name: update-dashboard
on:
  schedule:
    - cron: '30 2 1-5 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y poppler-utils && pip install -r requirements.txt
      - run: python fetch_pdf.py || echo "자동 다운로드 실패 - pdf/ 폴더의 기존 파일로 진행"
      - run: python update.py
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A pdf data docs
          git diff --cached --quiet || (git commit -m "월간 수출입동향 데이터 갱신" && git push)
